<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Närmaste station</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --text:#1b1b1f; --muted:#6b6b73; --line:#e4e1d8; --accent:#0a6bb5; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121316; --card:#1c1e22; --text:#ececf0; --muted:#9a9aa5; --line:#2c2f35; --accent:#5fb0f0; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  h1 { margin:0; font-size:28px; }
  .sub { color:var(--muted); margin:4px 0 18px; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:14px; }
  .card h2 { margin:0 0 8px; font-size:15px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .row { display:flex; align-items:center; gap:12px; padding:9px 0; border-top:1px solid var(--line); }
  .row:first-of-type { border-top:0; }
  .badge { min-width:42px; text-align:center; color:#fff; font-weight:700; border-radius:8px; padding:3px 6px; }
  .dest { flex:1; }
  .when { font-weight:700; font-variant-numeric:tabular-nums; }
  .late { color:#d6402f; }
  .msg { color:var(--muted); }
  .err { color:#d6402f; }
  button { font:inherit; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:8px 14px; cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1 id="station">Söker position…</h1>
  <p class="sub" id="info">Tillåt platsåtkomst när webbläsaren frågar.</p>
  <div id="out"></div>
</main>
<script>
const API = "https://transport.integration.sl.se/v1";
const $ = id => document.getElementById(id);
const MODES = { METRO: "Tunnelbana", TRAIN: "Pendeltåg" };
const COLORS = { 10:"#0a6bb5", 11:"#0a6bb5", 13:"#d6402f", 14:"#d6402f", 17:"#2e9d4a", 18:"#2e9d4a", 19:"#2e9d4a" };
const REFRESH_MS = 30000, MOVE_M = 150;

let sites = null, current = null, lastPos = null, timer = null;

function dist(a, b, c, d) { // meter, haversine
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(c - a), dLon = r(d - b);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

async function getSites() {
  if (sites) return sites;
  try {
    const c = JSON.parse(localStorage.getItem("sl_sites") || "null");
    if (c && Date.now() - c.t < 7 * 864e5) return (sites = c.d);
  } catch (e) {}
  const r = await fetch(API + "/sites?expand=true");
  if (!r.ok) throw new Error("Kunde inte hämta stationslistan (" + r.status + ")");
  sites = (await r.json()).filter(s => s.lat && s.lon).map(s => ({ id: s.id, name: s.name, lat: s.lat, lon: s.lon }));
  try { localStorage.setItem("sl_sites", JSON.stringify({ t: Date.now(), d: sites })); } catch (e) {}
  return sites;
}

async function getDepartures(id) {
  const r = await fetch(`${API}/sites/${id}/departures`);
  if (!r.ok) throw new Error("Kunde inte hämta avgångar (" + r.status + ")");
  const d = (await r.json()).departures || [];
  return d.filter(x => x.line && MODES[x.line.transport_mode]);
}

// Hitta närmaste plats som har tunnelbana eller pendeltåg (hoppar över ren busstrafik)
async function findStation(lat, lon) {
  const ranked = sites.map(s => ({ ...s, d: dist(lat, lon, s.lat, s.lon) })).sort((a, b) => a.d - b.d).slice(0, 30);
  for (let i = 0; i < ranked.length; i += 5) {
    const batch = ranked.slice(i, i + 5);
    const res = await Promise.all(batch.map(s => getDepartures(s.id).catch(() => [])));
    const k = res.findIndex(x => x.length);
    if (k >= 0) return { site: batch[k], deps: res[k] };
  }
  return null;
}

function fmt(d) {
  if (d.state === "CANCELLED") return { t: "Inställd", late: true };
  if (d.display) return { t: d.display, late: false };
  const t = new Date(d.expected || d.scheduled);
  return { t: t.toLocaleTimeString("sv-SE", { hour: "2-digit", minute: "2-digit" }), late: false };
}

function render(site, deps) {
  $("station").textContent = site.name;
  $("info").textContent = `${Math.round(site.d)} m från dig · uppdaterad ${new Date().toLocaleTimeString("sv-SE")}`;
  let html = "";
  for (const [mode, label] of Object.entries(MODES)) {
    const list = deps.filter(d => d.line.transport_mode === mode)
      .sort((a, b) => new Date(a.expected || a.scheduled) - new Date(b.expected || b.scheduled)).slice(0, 8);
    if (!list.length) continue;
    html += `<section class="card"><h2>${label}</h2>` + list.map(d => {
      const f = fmt(d), n = d.line.designation || d.line.id;
      const color = mode === "TRAIN" ? "#c6477f" : (COLORS[n] || "#555");
      const plat = d.stop_point && d.stop_point.designation ? ` <span class="msg">· spår ${d.stop_point.designation}</span>` : "";
      return `<div class="row"><span class="badge" style="background:${color}">${n}</span>
        <span class="dest">${d.destination}${plat}</span><span class="when ${f.late ? "late" : ""}">${f.t}</span></div>`;
    }).join("") + `</section>`;
  }
  $("out").innerHTML = html || `<p class="msg">Inga avgångar just nu.</p>`;
}

async function update(pos) {
  clearTimeout(timer);
  const { latitude: lat, longitude: lon } = pos.coords;
  try {
    await getSites();
    const moved = !lastPos || dist(lat, lon, lastPos.lat, lastPos.lon) > MOVE_M;
    if (moved || !current) {
      const f = await findStation(lat, lon);
      if (!f) { $("station").textContent = "Ingen station i närheten"; $("out").innerHTML = ""; return; }
      current = f.site; lastPos = { lat, lon };
      render(f.site, f.deps);
    } else {
      current.d = dist(lat, lon, current.lat, current.lon);
      render(current, await getDepartures(current.id));
    }
  } catch (e) {
    $("out").innerHTML = `<p class="err">${e.message}</p><button onclick="location.reload()">Försök igen</button>`;
  }
  timer = setTimeout(() => navigator.geolocation.getCurrentPosition(update, onErr, { enableHighAccuracy: true, maximumAge: 15000 }), REFRESH_MS);
}

function onErr(e) {
  $("station").textContent = "Ingen position";
  $("info").textContent = e.code === 1 ? "Platsåtkomst nekades. Tillåt den i webbläsarens inställningar och ladda om." : "Kunde inte hämta din position.";
}

if (!navigator.geolocation) onErr({ code: 0 });
else navigator.geolocation.getCurrentPosition(update, onErr, { enableHighAccuracy: true, maximumAge: 15000 });
</script>
</body>
</html>
